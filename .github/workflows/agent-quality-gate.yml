name: Agent Quality Gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install existing API dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate public evaluation evidence
        working-directory: .
        run: python scripts/validate_eval_report.py
      - name: Agent and trace regression
        env:
          PYTHONPATH: .
        run: >-
          pytest tests/aiqa/test_agent_lab.py tests/aiqa/test_agent_tools.py
          tests/aiqa/test_aiqa.py tests/aiqa/test_resilience.py
          tests/aiqa/test_distributed_resilience.py tests/aiqa/test_semantic_cache.py
          tests/test_observability.py -q
      - name: Python quality gates
        run: >-
          ruff check app tests/aiqa/test_agent_lab.py tests/aiqa/test_resilience.py
          tests/aiqa/test_distributed_resilience.py tests/aiqa/test_semantic_cache.py
          tests/test_observability.py && mypy app

  rag-integration:
    needs: backend-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jianli
          POSTGRES_PASSWORD: jianli-ci
          POSTGRES_DB: jianli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jianli -d jianli_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JIANLI_AIQA_TEST_DATABASE_URL: postgresql+psycopg://jianli:jianli-ci@127.0.0.1:5432/jianli_test
      JIANLI_AIQA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JIANLI_CSRF_HMAC_KEY: ci-csrf-key-32-bytes-minimum-value
      JIANLI_RATE_LIMIT_HMAC_KEY: ci-rate-key-32-bytes-minimum-value
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install existing API dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrate isolated evaluation database
        env:
          JIANLI_DATABASE_URL: ${{ env.JIANLI_AIQA_TEST_DATABASE_URL }}
        run: alembic upgrade head
      - name: Real pgvector and Redis RAG evaluation
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/aiqa/test_rag_eval.py::test_rag_literal_hit_cases
          tests/aiqa/test_rag_eval.py::test_rag_reject_cases
          tests/aiqa/test_rag_eval.py::test_privacy_questions_refused
          tests/aiqa/test_rag_eval.py::test_rag_false_reject_cases
          tests/aiqa/test_distributed_resilience.py::test_real_redis_cross_instance_atomic_probe
          -q

  web-delivery:
    needs: rag-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test, typecheck and build
        run: pnpm test && pnpm typecheck && pnpm build
