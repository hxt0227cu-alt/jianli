[project]
name = "jianli-api"
version = "0.1.0"
description = "FastAPI application and worker skeleton for Jianli"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "bcrypt==5.0.0",
    "cryptography==46.0.7",
    "fastapi==0.141.1",
    "psycopg==3.2.10",
    "python-multipart==0.0.20",  # M6 round 3: multipart uploads (uploadKnowledgeDocuments)
    "pypdf==6.15.0",  # TASK-KB-PDF-001: PDF text extraction for resume uploads
    "redis==8.1.0",
    "SQLAlchemy==2.0.43",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "psycopg-binary==3.2.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-config"
# Known harmless: SQLAlchemy has no built-in pgvector type, so the inspector reports
# the 0005 embedding column as unrecognized. We keep zero dependencies on pgvector.
filterwarnings = [
    "ignore:Did not recognize type 'vector' of column 'embedding':sqlalchemy.exc.SAWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese-language project: full-width punctuation is correct in CN strings/comments,
# so disable the ambiguous-unicode rules that would otherwise flag every CN literal.
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are injected by parameter name; the import-then-parameter pattern
# trips F811 (redefinition of the imported fixture name), which is a false positive here.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

# pypdf ships no type stubs; treat it as untyped rather than failing the gate.
[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true
