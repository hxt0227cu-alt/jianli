[project]
name = "jianli-api"
version = "0.1.0"
description = "FastAPI application and worker skeleton for Jianli"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "psycopg==3.2.10",
    "redis==8.1.0",
    "SQLAlchemy==2.0.43",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "psycopg-binary==3.2.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
