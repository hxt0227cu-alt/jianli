# TASK-DEPLOY-001: nginx serving the built frontend (dist/) and proxying /api to
# the FastAPI container. HTTPS via Let's Encrypt (certbot). Replace
# <your-domain> with the real domain after ICP filing. The certbot block stays
# inactive (HTTP 200) until certificates exist; once issued, the 80 -> 443
# redirect below takes effect (certbot-init.sh manages issuance).

server {
    listen 80;
    server_name <your-domain>;

    # Let's Encrypt ACME challenge endpoint (always served over HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After certs exist, redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <your-domain>;

    ssl_certificate /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (the FastAPI app is mounted under /api/v1 per OpenAPI servers.url).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSE endpoints (slot stream / answer stream) need buffering disabled.
    location ~ ^/api/v1/(slots/events|answers) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Static asset caching.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
