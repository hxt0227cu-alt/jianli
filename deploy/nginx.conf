# HTTP bootstrap configuration. It exists only so Certbot can complete ACME.
# No application or API is exposed before a valid HTTPS configuration is installed.

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /internal/metrics { return 404; }
    location / { return 503; }
}
