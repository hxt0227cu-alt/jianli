# HTTP bootstrap configuration. scripts/deploy.sh copies this file to
# deploy/runtime/default.conf before the first start. It deliberately contains
# no TLS certificate reference, so a brand-new server can start before Certbot.

server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge endpoint (always served over HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /internal/metrics { return 404; }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoints must be declared before the generic API regex.
    location = /answers:stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /slots/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # The FastAPI application exposes root paths; the browser does not prepend
    # /api. Keep this list aligned with the approved routers.
    location ~ ^/(auth|appointments|appointment-confirmations|slots|admin|pages|conversations)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static asset caching.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
