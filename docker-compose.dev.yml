services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jianli_dev
      POSTGRES_USER: jianli
      POSTGRES_PASSWORD: jianli_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jianli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianli -d jianli_dev"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  jianli_pgdata:
