services:
  postgres:
    # pgvector/pg16 image: adds the `vector` extension required by knowledge embeddings
    # (migration 0005). Data volume is preserved across the image swap.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jianli_dev
      POSTGRES_USER: jianli
      POSTGRES_PASSWORD: jianli_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jianli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianli -d jianli_dev"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "api:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  jianli_pgdata:
