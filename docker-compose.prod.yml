# Candidate stack for the approved deployment workflow.
# Production entrypoint: copy apps/api/.env.prod.example to a 0600 .env, fill
# real values, then run ./scripts/deploy.sh. Do not use a bare `compose up`:
# deploy.sh enforces environment/SMTP/HTTPS/secret checks, locking and health waits.
# The Web image builds the frontend from pnpm-lock.yaml; host dist/ is not mounted.
# API + Worker share the same image; Worker is a separate process (architecture §6).

name: jianli-prod

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-image: &api-image
  image: ${JIANLI_API_IMAGE:-jianli-api:local}
  build:
    context: ./apps/api
  mem_limit: 640m
  cpus: "0.80"
  pids_limit: 256

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${JIANLI_POSTGRES_DB:-jianli_prod}
      POSTGRES_USER: ${JIANLI_POSTGRES_USER:-jianli}
      POSTGRES_PASSWORD: ${JIANLI_POSTGRES_PASSWORD:?must be set in .env}
    volumes:
      - jianli_pgdata:/var/lib/postgresql/data
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 640m
    cpus: "0.65"
    pids_limit: 256

  redis:
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${JIANLI_REDIS_PASSWORD:?must be set in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - jianli_redisdata:/data
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 192m
    cpus: "0.20"
    pids_limit: 128

  migrate:
    <<: *api-image
    restart: "no"
    env_file: ${JIANLI_ENV_FILE:-.env}
    environment:
      JIANLI_DATABASE_URL: postgresql+psycopg://${JIANLI_POSTGRES_USER:-jianli}:${JIANLI_POSTGRES_PASSWORD}@postgres:5432/${JIANLI_POSTGRES_DB:-jianli_prod}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    networks: [backend]

  slots:
    <<: *api-image
    restart: "no"
    env_file: ${JIANLI_ENV_FILE:-.env}
    environment:
      JIANLI_DATABASE_URL: postgresql+psycopg://${JIANLI_POSTGRES_USER:-jianli}:${JIANLI_POSTGRES_PASSWORD}@postgres:5432/${JIANLI_POSTGRES_DB:-jianli_prod}
    command: ["python", "-m", "app.appointments.materialize_slots", "--weeks", "8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *json-logging
    networks: [backend]

  knowledge-init:
    <<: *api-image
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /srv/jianli/var/knowledge && chown -R 10001:10001 /srv/jianli/var/knowledge && chmod 0700 /srv/jianli/var/knowledge"]
    volumes:
      - jianli_knowledge:/srv/jianli/var/knowledge
    logging: *json-logging
    network_mode: none

  api:
    <<: *api-image
    restart: always
    env_file: ${JIANLI_ENV_FILE:-.env}
    environment:
      JIANLI_DATABASE_URL: postgresql+psycopg://${JIANLI_POSTGRES_USER:-jianli}:${JIANLI_POSTGRES_PASSWORD}@postgres:5432/${JIANLI_POSTGRES_DB:-jianli_prod}
      JIANLI_REDIS_URL: redis://:${JIANLI_REDIS_PASSWORD}@redis:6379/0
      JIANLI_ALLOWED_ORIGINS: ${JIANLI_ALLOWED_ORIGINS}
      JIANLI_KNOWLEDGE_STORAGE_DIR: /srv/jianli/var/knowledge
      JIANLI_OBSERVABILITY_ENABLED: "true"
      JIANLI_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      JIANLI_OTEL_SERVICE_NAME: jianli-api
    volumes:
      - jianli_knowledge:/srv/jianli/var/knowledge
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=${JIANLI_FRONTEND_SUBNET:-172.30.10.0/24}", "--no-access-log"]
    depends_on:
      slots:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      knowledge-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/pages/resume/recommendations', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *json-logging
    networks: [frontend, backend, observability, egress]

  seed-kb:
    profiles: ["tools"]
    <<: *api-image
    restart: "no"
    env_file: ${JIANLI_ENV_FILE:-.env}
    environment:
      JIANLI_DATABASE_URL: postgresql+psycopg://${JIANLI_POSTGRES_USER:-jianli}:${JIANLI_POSTGRES_PASSWORD}@postgres:5432/${JIANLI_POSTGRES_DB:-jianli_prod}
      JIANLI_REDIS_URL: redis://:${JIANLI_REDIS_PASSWORD}@redis:6379/0
      JIANLI_KNOWLEDGE_STORAGE_DIR: /srv/jianli/var/knowledge
    volumes:
      - jianli_knowledge:/srv/jianli/var/knowledge
    command: ["python", "scripts/seed_kb.py", "--no-clear"]
    depends_on:
      api:
        condition: service_healthy
    logging: *json-logging
    networks: [backend, egress]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    restart: always
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    expose:
      - "4318"
    logging: *json-logging
    networks: [observability]
    mem_limit: 192m
    cpus: "0.20"
    pids_limit: 128

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: always
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jianli_prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    logging: *json-logging
    networks: [observability, admin]
    mem_limit: 384m
    cpus: "0.30"
    pids_limit: 128

  grafana:
    image: grafana/grafana:12.3.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${JIANLI_GRAFANA_ADMIN_PASSWORD:?must be set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - jianli_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    logging: *json-logging
    networks: [observability, admin]
    mem_limit: 320m
    cpus: "0.30"
    pids_limit: 128

  worker:
    <<: *api-image
    restart: always
    env_file: ${JIANLI_ENV_FILE:-.env}
    environment:
      JIANLI_DATABASE_URL: postgresql+psycopg://${JIANLI_POSTGRES_USER:-jianli}:${JIANLI_POSTGRES_PASSWORD}@postgres:5432/${JIANLI_POSTGRES_DB:-jianli_prod}
      JIANLI_REDIS_URL: redis://:${JIANLI_REDIS_PASSWORD}@redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      slots:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      knowledge-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib, psycopg, redis;
          from app.config import Settings;
          s=Settings.from_env();
          assert b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes();
          c=psycopg.connect(s.database_url.replace('postgresql+psycopg://','postgresql://',1),connect_timeout=3);
          c.execute('SELECT 1').fetchone(); c.close();
          r=redis.Redis.from_url(s.redis_url,socket_connect_timeout=3,socket_timeout=3);
          assert r.ping(); r.close()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *json-logging
    networks: [backend, egress]

  nginx:
    image: ${JIANLI_WEB_IMAGE:-jianli-web:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/runtime:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html && wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *json-logging
    networks: [frontend]
    mem_limit: 128m
    cpus: "0.20"
    pids_limit: 128

  certbot:
    image: certbot/certbot:v3.2.0
    profiles: ["tools"]
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    logging: *json-logging
    networks: [acme]
    mem_limit: 128m
    cpus: "0.20"
    pids_limit: 128

networks:
  frontend:
    ipam:
      config:
        - subnet: ${JIANLI_FRONTEND_SUBNET:-172.30.10.0/24}
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${JIANLI_BACKEND_SUBNET:-172.30.20.0/24}
  egress:
    ipam:
      config:
        - subnet: ${JIANLI_EGRESS_SUBNET:-172.30.30.0/24}
  admin:
    ipam:
      config:
        - subnet: ${JIANLI_ADMIN_SUBNET:-172.30.40.0/24}
  observability:
    internal: true
    ipam:
      config:
        - subnet: ${JIANLI_OBSERVABILITY_SUBNET:-172.30.50.0/24}
  acme:

volumes:
  jianli_pgdata:
  jianli_redisdata:
  jianli_knowledge:
  jianli_prometheus:
  jianli_grafana:
